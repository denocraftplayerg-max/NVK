name: Build and Release from dev

on:
  push:
    branches:
      - dev
  workflow_dispatch:   # 支持手动触发

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: 检出 dev 分支
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: 设置 JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: 构建 Mod JAR
        run: |
          chmod +x gradlew
          ./gradlew build

      - name: 查找生成的 JAR 文件
        id: find_jar
        run: |
          JAR_PATH=$(find build/libs -name "*.jar" ! -name "*-sources.jar" ! -name "*-dev.jar" | head -n 1)
          echo "jar_path=$JAR_PATH" >> $GITHUB_OUTPUT
          echo "找到 JAR: $JAR_PATH"

      - name: 获取版本号（从 gradle.properties 读取）
        id: version
        run: |
          VERSION=$(grep "^mod_version" gradle.properties | cut -d'=' -f2 | tr -d ' ')
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "版本号: $VERSION"

      - name: 创建 Release 并上传 JAR
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: VulkanMod ${{ steps.version.outputs.version }}
          body: |
            ✅ 来自 dev 分支的自动构建
            
            - 版本号: ${{ steps.version.outputs.version }}
            - 基于最新 dev 分支代码
          files: ${{ steps.find_jar.outputs.jar_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}